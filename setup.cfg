[nosetests]
verbosity=2
with-spec=1
spec-color=1
with-coverage=1
cover-package=service
cover-erase=1
cover-html=1
cover-html-dir=coverage

[coverage:run]
branch = True
source = service

[coverage:report]
show_missing = True

[flake8]
per-file-ignores =
    */__init__.py: F401 E402
max-line-length = 127
count = True

[pylint]
max-line-length = 127
disable = R,C